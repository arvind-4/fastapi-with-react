version: '3.8'

services:
  codespace:
    image: mcr.microsoft.com/devcontainers/universal:2
    command: sleep infinity
    volumes:
      - ..:/workspaces:cached

  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
